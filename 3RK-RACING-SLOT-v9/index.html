<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>3RK Racing Slot</title>
</head>
<body>
  <main id="shell">
    <section id="stage" aria-label="3RK Racing five payline slot machine">
      <img id="uiArtwork" alt="" draggable="false">
      <div id="reelViewport" aria-hidden="true"></div>
      <svg id="paylineOverlay" viewBox="0 0 1344 752" preserveAspectRatio="none" aria-hidden="true"></svg>

      <div id="creditsReadout" class="readout" data-editor-target="credits">5000</div>
      <div id="betReadout" class="readout" data-editor-target="bet">50</div>
      <div id="freeSpinCounter" data-editor-target="freeCounter" hidden></div>
      <div id="statusText" data-editor-target="status">GOOD LUCK!</div>

      <button class="hotspot art-button" data-action="leaderboard" data-editor-target="button.leaderboard" aria-label="Leaderboard"></button>
      <button class="hotspot art-button" data-action="pays" data-editor-target="button.pays" aria-label="Pays"></button>
      <button class="hotspot art-button" data-action="submitScore" data-editor-target="button.submitScore" aria-label="Submit score"></button>
      <button class="hotspot art-button" data-action="betUp" data-editor-target="button.betUp" aria-label="Increase bet"></button>
      <button class="hotspot art-button" data-action="betDown" data-editor-target="button.betDown" aria-label="Decrease bet"></button>
      <button class="hotspot art-button" data-action="spin" data-editor-target="button.spin" aria-label="Spin"></button>
      <button class="hotspot art-button" data-action="resetCredits" data-editor-target="button.resetCredits" aria-label="Reset credits"></button>
      <button id="musicButton" class="hotspot added-button" data-action="muteMusic" data-editor-target="button.muteMusic">MUSIC ON</button>

      <div id="normalWinPopup" class="number-win" data-editor-target="popup.normalWin" hidden></div>
      <div id="modalLayer" hidden>
        <div id="modalCard" data-editor-target="popup.active">
          <div id="modalContent"></div>
        </div>
      </div>

      <div id="editorSelection" hidden><span id="editorSelectionLabel"></span><i id="editorResizeHandle"></i></div>
    </section>
  </main>

  <button id="editorToggle" type="button" aria-label="Open visual slot editor">EDITOR</button>
  <aside id="editorPanel" hidden></aside>

  <script>
  (()=>{
    const cb=Date.now().toString(36); window.KART_SLOT_CACHE_BUSTER=cb;
    const style=document.createElement('link'); style.rel='stylesheet'; style.href='style.css?cb='+cb; document.head.appendChild(style);
    const scripts=['default-settings','config','math','outcomes','rendering','animation','audio','ui','editor','game'];
    let chain=Promise.resolve();
    scripts.forEach(name=>{chain=chain.then(()=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='js/'+name+'.js?cb='+cb;s.onload=resolve;s.onerror=reject;document.body.appendChild(s);}));});
    chain.catch(err=>{console.error(err);document.body.innerHTML='<pre style="color:white">Unable to load game files. Keep the supplied folder together.</pre>';});
  })();
  </script>
</body>
</html>
